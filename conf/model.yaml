# Configuration du modèle (hyperparamètres XGBoost, tracking MLflow)
model:
  algorithm: xgboost
  test_size: 0.2
  random_state: 42
  n_trials: 30
  xgboost:
    max_depth: 6
    learning_rate: 0.1
    n_estimators: 300
    subsample: 0.9
    colsample_bytree: 0.8
    reg_lambda: 1.0
    scale_pos_weight: 1.0
  artifacts_dir: data/artifacts
  mlflow_tracking_uri: sqlite:///mlruns.db
  mlflow_experiment: cif_credit_intelligence
  ablation_families:
    - profile_income
    - savings
    - history
    - context