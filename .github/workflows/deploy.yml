name: Build & Push API Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (chargé localement, scan avant push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/huggingface/Dockerfile
          push: false
          load: true
          tags: |
            ghcr.io/sow221/cif-credit-intelligence/api:latest
            ghcr.io/sow221/cif-credit-intelligence/api:${{ github.sha }}

      - name: Trivy scan (image publiée publiquement — rapport)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/sow221/cif-credit-intelligence/api:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Push (après scan)
        run: |
          docker push ghcr.io/sow221/cif-credit-intelligence/api:latest
          docker push ghcr.io/sow221/cif-credit-intelligence/api:${{ github.sha }}
