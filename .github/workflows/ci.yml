name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  quality:
    name: Lint & Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy typecheck
        run: mypy src

      - name: Tests (unitaires + intégration)
        run: pytest -q tests

      - name: pip-audit (dépendances vulnérables)
        # Rapport, pas bloquant : un stack ML a beaucoup de dépendances transitives, souvent
        # avec des avis mineurs sans correctif immédiat. Objectif = visibilité, pas un blocage
        # aveugle qui casserait la CI sur des CVE non exploitables dans ce contexte.
        run: |
          python -m pip install -q pip-audit
          pip-audit --desc || true

  build-docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [quality]
    strategy:
      matrix:
        service: [api, dagster, mlflow]
    steps:
      - uses: actions/checkout@v4

      - name: Build image ${{ matrix.service }}
        run: docker build -f docker/Dockerfile.${{ matrix.service }} -t cif-${{ matrix.service }}:${{ github.sha }} .

      - name: Trivy scan (vulnérabilités image, rapport)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: cif-${{ matrix.service }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"

  integration-smoke:
    name: Stack integration smoke test (cycle complet)
    runs-on: ubuntu-latest
    needs: [quality]
    # Vérifie le cycle RÉEL de bout en bout — pas juste que les images se construisent
    # (le job build-docker ci-dessus ne l'aurait pas détecté) : génération des données,
    # entraînement, enregistrement dans un vrai MLflow (Postgres+MinIO), puis démarrage de
    # l'API contre ce modèle fraîchement enregistré, et des dashboards Prometheus/Grafana.
    env:
      MLFLOW_TRACKING_URI: http://localhost:5000
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Démarrer le socle (Postgres, MinIO, MLflow)
        working-directory: infra
        run: |
          set -e
          for attempt in 1 2 3; do
            docker compose up -d --build postgres minio mlflow && exit 0
            echo "Tentative $attempt échouée (pull registre potentiellement transitoire), nouvel essai dans 15s..." >&2
            docker compose down -v || true
            sleep 15
          done
          exit 1

      - name: Attendre MLflow
        run: |
          set -e
          for _ in $(seq 1 30); do
            curl -sf http://localhost:5000/health > /dev/null && { echo "MLflow OK"; exit 0; }
            sleep 5
          done
          echo "MLflow n'a jamais répondu" >&2; exit 1

      - name: Cycle réel — génération, entraînement, enregistrement (stage Production)
        run: |
          cif-generate
          cif-train --register --tracking-uri "$MLFLOW_TRACKING_URI" --experiment cif_credit_intelligence

      - name: Démarrer le reste de la stack (API, Dagster, Prometheus, Grafana)
        working-directory: infra
        run: |
          set -e
          for attempt in 1 2 3; do
            docker compose up -d --build && exit 0
            echo "Tentative $attempt échouée, nouvel essai dans 15s..." >&2
            sleep 15
          done
          exit 1

      - name: Attendre les services applicatifs
        run: |
          set -e
          wait_for() {
            name="$1"; url="$2"
            for _ in $(seq 1 30); do
              if curl -sf "$url" > /dev/null; then
                echo "$name OK ($url)"
                return 0
              fi
              sleep 5
            done
            echo "$name n'a jamais répondu sur $url" >&2
            return 1
          }
          wait_for "API scoring" "http://localhost:8000/v1/health"
          wait_for "Prometheus" "http://localhost:9090/-/healthy"
          wait_for "Grafana" "http://localhost:3001/api/health"
          wait_for "Dagster" "http://localhost:3000/"

      - name: Vérifie qu'un scoring réel répond (modèle chargé + décision)
        run: |
          curl -sf http://localhost:8000/v1/health | tee /dev/stderr | grep -q '"status":"ok"'

      - name: Logs (diagnostic en cas d'échec)
        if: failure()
        working-directory: infra
        run: docker compose logs --tail=200

      - name: Arrêter la stack
        if: always()
        working-directory: infra
        run: docker compose down -v