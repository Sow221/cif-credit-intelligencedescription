name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  quality:
    name: Lint & Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy typecheck
        run: mypy src

      - name: Unit tests
        run: pytest -q tests/unit

  build-docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [quality]
    strategy:
      matrix:
        service: [api, dagster, mlflow]
    steps:
      - uses: actions/checkout@v4

      - name: Build image ${{ matrix.service }}
        run: docker build -f docker/Dockerfile.${{ matrix.service }} -t cif-${{ matrix.service }}:${{ github.sha }} .