# Déploiement API de scoring — cluster K3s (Oracle Cloud Free Tier)
# 2 réplicas, probes /v1/health, secret JWT via k8s, image GHCR (modèle cuit
# dans /app/model, aucun accès MLflow requis au runtime).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cif-api
  namespace: cif
  labels:
    app: cif-api
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cif-api
  template:
    metadata:
      labels:
        app: cif-api
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: api
          image: ghcr.io/sow221/cif-credit-intelligence/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: CIF_ENV
              value: production
            - name: CIF_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cif-api-secret
                  key: jwt
            - name: CIF_API_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cif-api-secret
                  key: client_secret
            - name: CIF_MODEL_URI
              value: /app/model
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
      terminationGracePeriodSeconds: 30
