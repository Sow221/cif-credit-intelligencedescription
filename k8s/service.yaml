# Service NodePort — expose l'API sur le port 30080 du node (ouvert dans le
# security list OCI). URL demo : http://<ip-publique-du-node>:30080
# Pour une exposition par nom de domaine (TLS Cloudflare), voir ingress.yaml.
apiVersion: v1
kind: Service
metadata:
  name: cif-api
  namespace: cif
  labels:
    app: cif-api
    tier: backend
spec:
  type: NodePort
  selector:
    app: cif-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
      nodePort: 30080
      protocol: TCP
