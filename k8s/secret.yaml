# Secret d'application. EN PROD : creer le vrai secret, jamais committe :
#   kubectl -n cif create secret generic cif-api-secret \
#     --from-literal=jwt=$(openssl rand -hex 32) --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: cif-api-secret
  namespace: cif
type: Opaque
stringData:
  jwt: change-me-in-production
