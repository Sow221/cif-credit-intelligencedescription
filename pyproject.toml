[project]
name = "cif-credit-intelligence"
version = "1.0.0"
description = "CIF Credit Intelligence — plateforme de scoring de crédit pour l'écosystème CIF/DigiCoop-WA+"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TELQAN / CIF Credit Intelligence" }]
# Dépendances du chemin de serving (API + entraînement plain + registre) : c'est exactement
# ce qui est installé dans l'image de production. Volontairement minimal — dagster, matplotlib,
# pandera et optuna (orchestration, rapports, validation batch, recherche d'hyperparamètres) ne
# sont nécessaires qu'à l'entraînement/l'exploration, jamais au service d'une requête, et sont
# dans l'extra `training` ci-dessous. Une image de serving plus légère se construit plus vite,
# démarre plus vite, et réduit la surface d'attaque (voir docs/validation/load-test.md).
dependencies = [
    "numpy>=1.26,<2",
    "pandas>=2.1,<3",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "joblib>=1.3",
    "scipy>=1.11",
    "omegaconf>=2.3",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "click>=8.1",
    "mlflow>=2.11",
    "cloudpickle>=3.0",
    "evidently>=0.4.26,<0.5",
    "prometheus-client>=0.20",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8",
    "structlog>=24.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
# Orchestration (Dagster), recherche d'hyperparamètres (Optuna), validation de données par
# schéma (Pandera), rapports graphiques (Matplotlib) — jamais importés par le chemin de serving
# (vérifié : voir le commit qui a introduit cette séparation). boto3 : intégration S3 optionnelle
# de MLflow, jamais utilisée directement par ce code, gardée ici pour un futur backend distant.
training = [
    "dagster>=1.7",
    "dagster-webserver>=1.7",
    "matplotlib>=3.8",
    "pandera>=0.20",
    "optuna>=3.6",
    "boto3>=1.34",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.9",
    "pre-commit>=3.7",
    "httpx>=0.27",
    "dagster>=1.7",
    "dagster-webserver>=1.7",
    "matplotlib>=3.8",
    "pandera>=0.20",
    "optuna>=3.6",
    "boto3>=1.34",
]
quality = [
    "great-expectations>=0.18",
]
repro = [
    "dvc>=3.0",
]
data = [
    "kaggle>=1.6",
]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
cif-generate = "cli.generate:main"
cif-train = "cli.train:main"
cif-evaluate = "cli.evaluate:main"
cif-register-model = "cli.register:main"
cif-export-model = "cli.export_model:main"
cif-export-lc-model = "cli.export_lending_club_model:main"
cif-decision = "cli.decision:main"
cif-ingest-lc = "cli.ingest_lending_club:main"
cif-benchmark = "cli.benchmark:main"
cif-promote = "cli.promote:promote"
cif-rollback = "cli.promote:rollback_cmd"
cif-api = "api.app:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
api = ["py.typed"]
cli = ["py.typed"]
config = ["py.typed"]
data = ["py.typed"]
evaluation = ["py.typed"]
features = ["py.typed"]
models = ["py.typed"]
monitoring = ["py.typed"]
services = ["py.typed"]
utils = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "pipelines"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true
exclude = ["infra/", "docs/"]
warn_unused_configs = true
disallow_any_generics = false
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
# Modules tiers sans types publiés (ou absents en environnement local) : analysés comme Any.
module = [
    "alembic.*",
    "evidently.*",
    "mlflow.*",
    "omegaconf.*",
    "prometheus_client",
    "structlog",
    "sklearn.*",
    "yaml",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=src --cov-report=term-missing --cov-fail-under=70"
pythonpath = ["src"]
