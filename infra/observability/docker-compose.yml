version: "3.8"

# Stack d'observabilité standard (Prometheus + Grafana) scrapant l'API CIF.
# Usage : docker compose -f infra/observability/docker-compose.yml up
services:
  api:
    image: ghcr.io/sow221/cif-credit-intelligence/api:latest
    environment:
      - CIF_MODEL_URI=/app/model
      - PORT=8000
    ports:
      - "8000:8000"
    networks:
      - cif
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus:/etc/prometheus
    ports:
      - "9090:9090"
    networks:
      - cif

  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    ports:
      - "3000:3000"
    networks:
      - cif

networks:
  cif:

volumes:
  grafana-data:
