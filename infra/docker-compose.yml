# CIF Credit Intelligence — plateforme complète
# MLflow tracker + registry, Dagster, API de scoring, Prometheus, Grafana, Alertmanager
# Réseau interne isolé : rien n'est exposé publiquement sauf les ports documentés.

name: cif-credit-intelligence

services:
  postgres:
    # Miroir Google (mirror.gcr.io) plutôt que docker.io direct : les runners CI
    # partagent des IP fréquemment throttlées par la limite de débit anonyme de
    # Docker Hub (confirmé en pratique : "pull access denied" en CI, image publique
    # pourtant valide). Aucune authentification requise, zéro nouveau secret.
    image: mirror.gcr.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: ${PG_USER:-mlflow}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-mlflow}
      POSTGRES_DB: ${PG_DB:-mlflow}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-mlflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [cif]

  minio:
    # mirror.gcr.io ne mirrore de façon fiable que les images "library" officielles
    # (confirmé en pratique : "manifest unknown" pour minio/minio:latest via le miroir).
    # MinIO publie ses propres images sur quay.io, qui n'a pas la même limite de débit
    # anonyme agressive que Docker Hub pour les IP de CI partagées.
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mlflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-mlflowminio}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [cif]

  mlflow:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mlflow
    ports:
      - "5000:5000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-mlflow}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-mlflowminio}
      BACKEND_STORE_URI: postgresql+psycopg2://${PG_USER:-mlflow}:${PG_PASSWORD:-mlflow}@postgres:5432/${PG_DB:-mlflow}
      ARTIFACT_ROOT: s3://mlflow-artifacts
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [cif]

  dagster:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dagster
    ports:
      - "3000:3000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DAGSTER_HOME: /opt/dagster/home
    volumes:
      - dagster_home:/opt/dagster/home
      - ../src:/app/src
      - ../pipelines:/app/pipelines
      - ../conf:/app/conf
      - ../data:/app/data
    depends_on:
      mlflow:
        condition: service_healthy
    networks: [cif]

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      mlflow:
        condition: service_healthy
    networks: [cif]

  prometheus:
    image: mirror.gcr.io/prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus
      - prom_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - api
      - mlflow
    networks: [cif]

  alertmanager:
    image: mirror.gcr.io/prom/alertmanager:v0.27.0
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager:/etc/alertmanager
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    networks: [cif]

  grafana:
    image: mirror.gcr.io/grafana/grafana:11.1.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks: [cif]

networks:
  cif:
    driver: bridge

volumes:
  pg_data:
  minio_data:
  prom_data:
  grafana_data:
  dagster_home: