# Configuration Prometheus — collecte des métriques API et MLflow
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # API de scoring
  - job_name: cif_api
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: cif_score_api

  # MLflow
  - job_name: mlflow
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["mlflow:5000"]
        labels:
          service: mlflow