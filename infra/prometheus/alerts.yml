# Alertes ML — dérive et santé du service de scoring
groups:
  - name: cif_ml_alerts
    interval: 60s
    rules:
      - alert: ScoringApiDown
        expr: up{job="cif_api"} == 0
        for: 2m
        labels:
          severity: critical
          team: rs
        annotations:
          summary: "API de scoring injoignable"
      - alert: HighDriftRatio
        expr: cif_drift_ratio > 0.2
        for: 10m
        labels:
          severity: warning
          team: rs
        annotations:
          summary: "Dérive de données détectée (ratio > 0.2)"
      - alert: ModelLatencyHigh
        expr: histogram_quantile(0.95, sum(rate(cif_score_duration_seconds_bucket[5m])) by (le)) > 1.0
        for: 10m
        labels:
          severity: warning
          team: rs
        annotations:
          summary: "P95 de latence du scoring > 1s"