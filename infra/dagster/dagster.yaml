# Configuration Dagster — stockage local (sqlite) sur le volume dagster_home.
#
# Volontairement minimal : le bloc `storage` unifié configure à lui seul le
# run storage, l'event log storage, le schedule storage ET les compute logs
# avec des défauts sqlite/locaux sains (vérifié via DagsterInstance.get()).
# L'ancienne config de ce fichier dupliquait ça avec des clés `run_storage`/
# `event_log_storage` séparées ET obsolètes (chemins `dagster.core.*`,
# introuvables depuis Dagster 1.x — le module racine est `dagster._core`) :
# Dagster rejetait le fichier au démarrage ("Found config for `storage` which
# is incompatible with `run_storage`, ..."), confirmé en CI.
storage:
  sqlite:
    base_dir: /opt/dagster/home/storage
